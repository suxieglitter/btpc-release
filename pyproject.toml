[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "btpc"
version = "0.1.0"
description = "Barlow Twins self-supervised P-wave polarity classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "suxieglitter" }]
keywords = ["seismology", "polarity", "self-supervised learning", "barlow twins"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "h5py>=3.7",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
    "tqdm",
    "pyyaml>=6.0",
]

[project.scripts]
btpc-train = "btpc.train:main"
btpc-valid = "btpc.valid:main"
btpc-predict = "btpc.predict:main"

[tool.setuptools]
packages = ["btpc"]
